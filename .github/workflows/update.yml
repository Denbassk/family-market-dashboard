name: update-dashboard

on:
  schedule:
    - cron: "0 3 * * *"      # каждый день в 03:00 UTC (~06:00 Киев)
  workflow_dispatch:
    inputs:
      skip_staging:
        description: "Не пересобирать _dash_tx26 (дешевле, данные продаж не обновятся)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY" || { echo "::error::GCP_SA_KEY пуст"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > /tmp/sa-key.json
          python -c "import json,sys;d=json.load(open('/tmp/sa-key.json'));sys.exit(0 if d.get('type')=='service_account' else 1)" \
            || { echo "::error::GCP_SA_KEY не похож на ключ service account"; exit 1; }

      - name: Fetch data from BigQuery
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
          REPORT_YEAR: "2026"
          SKIP_STAGING: ${{ inputs.skip_staging && '1' || '' }}
        run: python scripts/build_data.py

      - name: Удалить ключ
        if: always()
        run: rm -f /tmp/sa-key.json

      - name: Install test deps
        run: npm i --no-save --silent jsdom@26

      - name: Проверка синтаксиса
        run: node tests/check_syntax.js

      - name: Проверка f-строк в SQL
        run: python tools/check_fstrings.py

      - name: Гейт — автотесты дашборда
        run: |
          set +e
          node tests/check_dashboard.js
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::Автотесты провалены — обновление данных остановлено, прод не тронут"
            exit 1
          fi
          echo "Автотесты прошли (код возврата $rc)"

      - name: Commit updated data
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs/
          if git diff --staged --quiet; then
            echo "Нет изменений."
            exit 0
          fi
          git commit -m "auto: обновление данных $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then echo "запушено с попытки $i"; exit 0; fi
            echo "push отклонён, подтягиваю main и пробую снова"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::не удалось запушить данные после 3 попыток"
          exit 1

      - name: Выгрузить собранные данные при провале
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: built-data
          path: docs/*.json
          retention-days: 3