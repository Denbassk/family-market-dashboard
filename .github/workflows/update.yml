name: update-dashboard

on:
  schedule:
    - cron: "0 3 * * *"      # каждый день в 03:00 UTC (~06:00 Киев)
  workflow_dispatch:          # ручной запуск (кнопка «Обновить сейчас» / вкладка Actions)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > /tmp/sa-key.json
      - name: Fetch data from BigQuery
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
          REPORT_YEAR: "2026"
        run: python scripts/build_data.py
      - name: Commit updated data
        run: |
          rm -f /tmp/sa-key.json
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/full_data.json
          if git diff --staged --quiet; then
            echo "Нет изменений."
          else
            git commit -m "auto: обновление данных $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
